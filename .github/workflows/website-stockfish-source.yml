name: Package Stockfish.js 19 source and GPLv3 for the website

on:
  push:
    paths:
      - '.github/workflows/website-stockfish-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prunex-website-engine-source
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Prunex
        uses: actions/checkout@v7
      - name: Check out Stockfish.js upstream source
        uses: actions/checkout@v7
        with:
          repository: nmrugg/stockfish.js
          ref: master
          path: stockfishjs-source
          persist-credentials: false
      - name: Package corresponding engine source and license
        run: |
          mkdir -p website/public
          tar --exclude=.git --exclude=node_modules -czf website/public/engine-source.tar.gz -C stockfishjs-source .
          cp stockfishjs-source/Copying.txt website/public/COPYING.txt
          tar -tzf website/public/engine-source.tar.gz | grep -q 'src/'
          grep -q 'GNU GENERAL PUBLIC LICENSE' website/public/COPYING.txt
          ls -lh website/public/engine-source.tar.gz website/public/COPYING.txt
      - name: Commit GPL source downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/engine-source.tar.gz website/public/COPYING.txt
          if git diff --cached --quiet; then
            echo "Source archive is already current."
          else
            git commit -m "Publish Stockfish.js 19 source and GPLv3 license"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
