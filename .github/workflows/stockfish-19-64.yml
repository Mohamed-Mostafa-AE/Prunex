name: Verified Prunex vs Stockfish 19 — 64 games

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stockfish-19-64.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tools/stockfish-19-match/**'
      - 'tools/stockfish-2.0-match/render_evidence.py'
      - 'tests/search_regression.cpp'
      - 'tests/test_stockfish_19_node_limit.py'
      - 'tests/test_replay_evidence.py'
      - 'docs/stockfish-19-reproduction.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stockfish-19-64.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tools/stockfish-19-match/**'
      - 'tools/stockfish-2.0-match/render_evidence.py'
      - 'tests/search_regression.cpp'
      - 'tests/test_stockfish_19_node_limit.py'
      - 'tests/test_replay_evidence.py'
      - 'docs/stockfish-19-reproduction.md'
  workflow_dispatch:
    inputs:
      nodes_per_move:
        description: 'Maximum nodes per move for each engine'
        required: true
        default: '1000000'
        type: string
      stockfish_hash_mb:
        description: 'Stockfish 19 Hash setting in MiB; Prunex uses 2^22 TT entries'
        required: true
        default: '160'
        type: string

permissions:
  contents: read

concurrency:
  group: prunex-stockfish-19-64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  match:
    name: Verify engines, run 64 games, and render replay evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out Prunex source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify runner build tools
        run: |
          cmake --version
          g++ --version
          git --version
          python3 --version
          make --version

      - name: Install FFmpeg only when needed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout 180s sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
            timeout 900s sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends -o Dpkg::Use-Pty=0 ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install Python replay dependencies
        run: |
          python3 -m pip install --user --disable-pip-version-check --timeout 30 --retries 2 python-chess pillow cairosvg

      - name: Build Prunex with a 160 MiB transposition table and run regressions
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Build pinned Stockfish 19 with disclosed node-limit polling patch
        run: |
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git stockfish-19
          SOURCE_COMMIT="$(git -C stockfish-19 rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "edb0d9db6731067ec50ce619ff372b463bc4dd5d"
          PATCH_FILE="$GITHUB_WORKSPACE/tools/stockfish-19-match/patches/stockfish-19-node-budget.patch"
          git -C stockfish-19 apply --check "$PATCH_FILE"
          git -C stockfish-19 apply "$PATCH_FILE"
          git -C stockfish-19 diff --check
          PATCH_SHA="$(sha256sum "$PATCH_FILE" | awk '{print $1}')"
          echo "STOCKFISH_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "STOCKFISH_SOURCE_PATCH_SHA256=$PATCH_SHA" >> "$GITHUB_ENV"
          make -C stockfish-19/src build ARCH=x86-64 -j2
          test -s stockfish-19/src/nn-1a298aa575a0.nnue
          cp stockfish-19/src/nn-1a298aa575a0.nnue "$GITHUB_WORKSPACE/"

      - name: Verify Stockfish 19 source, NNUE, UCI identity, and benchmark
        run: |
          mkdir -p verified-stockfish-19-64/evidence
          cp tools/stockfish-19-match/patches/stockfish-19-node-budget.patch \
            verified-stockfish-19-64/evidence/stockfish-19-node-budget.patch
          printf '%s  %s\\n' "$STOCKFISH_SOURCE_PATCH_SHA256" \
            "stockfish-19-node-budget.patch" \
            > verified-stockfish-19-64/evidence/stockfish-19-node-budget.patch.sha256
          python3 tools/stockfish-19-match/verify_stockfish_19.py \
            --engine stockfish-19/src/stockfish \
            --source-commit "$STOCKFISH_SOURCE_COMMIT" \
            --output verified-stockfish-19-64/stockfish-verification.json \
            --evidence-dir verified-stockfish-19-64/evidence

      - name: Test Stockfish 19 node-limit enforcement in both colors
        env:
          NODES_PER_MOVE_INPUT: ${{ inputs.nodes_per_move }}
          STOCKFISH_HASH_MB_INPUT: ${{ inputs.stockfish_hash_mb }}
        run: |
          NODES_PER_MOVE="${NODES_PER_MOVE_INPUT:-1000000}"
          STOCKFISH_HASH_MB="${STOCKFISH_HASH_MB_INPUT:-160}"
          python3 tests/test_stockfish_19_node_limit.py \
            --prunex build/prunex \
            --stockfish stockfish-19/src/stockfish \
            --nodes "$NODES_PER_MOVE" \
            --stockfish-hash-mb "$STOCKFISH_HASH_MB" \
            --plies 24

      - name: Run the 64 color-balanced games
        if: github.event_name != 'pull_request'
        env:
          NODES_PER_MOVE_INPUT: ${{ inputs.nodes_per_move }}
          STOCKFISH_HASH_MB_INPUT: ${{ inputs.stockfish_hash_mb }}
          PRUNEX_TT_BITS: '22'
          STOCKFISH_SOURCE_COMMIT: ${{ env.STOCKFISH_SOURCE_COMMIT }}
          STOCKFISH_SOURCE_PATCH_SHA256: ${{ env.STOCKFISH_SOURCE_PATCH_SHA256 }}
        run: |
          NODES_PER_MOVE="${NODES_PER_MOVE_INPUT:-1000000}"
          STOCKFISH_HASH_MB="${STOCKFISH_HASH_MB_INPUT:-160}"
          python3 tools/stockfish-19-match/run_match.py \
            --prunex build/prunex \
            --stockfish stockfish-19/src/stockfish \
            --nodes "$NODES_PER_MOVE" \
            --stockfish-hash-mb "$STOCKFISH_HASH_MB" \
            --out verified-stockfish-19-64

      - name: Render PGN replay, sound-enabled MP4, and 64-position poster
        if: github.event_name != 'pull_request'
        run: |
          python3 tools/stockfish-2.0-match/render_evidence.py \
            --pgn verified-stockfish-19-64/all-games.pgn \
            --out verified-stockfish-19-64/evidence \
            --fps 3
          find verified-stockfish-19-64 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > verified-stockfish-19-64/SHA256SUMS.txt

      - name: Upload complete or partial match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prunex-stockfish-19-64-${{ github.run_number }}
          path: verified-stockfish-19-64/
          if-no-files-found: warn
          retention-days: 90
