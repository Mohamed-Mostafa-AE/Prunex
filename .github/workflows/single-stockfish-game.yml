name: One game vs Stockfish 2.0

on:
  push:
    branches: ['test/single-stockfish-2.0']
    paths:
      - '.github/workflows/single-stockfish-game.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tests/**'
      - 'tools/stockfish-2.0-match/patches/stockfish-2-node-budget.patch'
      - 'tools/stockfish-2.0-match/run_single_game.py'

permissions:
  contents: write

concurrency:
  group: prunex-single-stockfish-2-game
  cancel-in-progress: false

jobs:
  play-one-game:
    name: Build pinned Stockfish 2.0 and play one game
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out the selected Prunex development commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Install native build and match tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ make git python3-pip
          python3 -m pip install --user --disable-pip-version-check python-chess

      - name: Build the pinned Stockfish 2.0 opponent
        run: |
          git clone --depth 1 --branch sf_2.0 https://github.com/official-stockfish/Stockfish.git stockfish-2.0
          SOURCE_COMMIT="$(git -C stockfish-2.0 rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "aa2de53a83ca5423c8c8007abf71f9afdf589d93"
          PATCH_FILE="$GITHUB_WORKSPACE/tools/stockfish-2.0-match/patches/stockfish-2-node-budget.patch"
          git -C stockfish-2.0 apply --check "$PATCH_FILE"
          git -C stockfish-2.0 apply "$PATCH_FILE"
          git -C stockfish-2.0 diff --check
          PATCH_SHA="$(sha256sum "$PATCH_FILE" | awk '{print $1}')"
          echo "STOCKFISH_SOURCE_PATCH_SHA256=$PATCH_SHA" >> "$GITHUB_ENV"
          make -C stockfish-2.0/src build ARCH=x86-64 -j2

      - name: Build the current Prunex development engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build build --parallel 2

      - name: Run the native regression and perft suite
        run: ctest --test-dir build --output-on-failure

      - name: Play exactly one color-assigned game
        env:
          PRUNEX_TT_BITS: '22'
        run: |
          python3 tools/stockfish-2.0-match/run_single_game.py \
            --prunex build/prunex \
            --stockfish stockfish-2.0/src/stockfish \
            --nodes 1000000 \
            --stockfish-hash-mb 256 \
            --out single-game-evidence

      - name: Generate checksums and archive the result permanently
        if: success()
        run: |
          set -euo pipefail
          cd single-game-evidence
          sha256sum single-game.pgn single-game.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/strength-ladder-progress:refs/remotes/origin/strength-ladder-progress" || true
          WORKTREE="/tmp/strength-ladder-progress"
          if git show-ref --verify --quiet refs/remotes/origin/strength-ladder-progress; then
            git worktree add -B strength-ladder-progress "$WORKTREE" refs/remotes/origin/strength-ladder-progress
          else
            git worktree add -b strength-ladder-progress "$WORKTREE" HEAD
          fi
          DEST="progress/smoke-tests/stockfish-2.0/run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$WORKTREE/$DEST"
          cp -a single-game-evidence/. "$WORKTREE/$DEST/"
          cat > "$WORKTREE/$DEST/README.md" <<EOF
          # Prunex single-game validation

          Workflow run: ${GITHUB_RUN_NUMBER}
          Prunex source commit: ${GITHUB_SHA}
          Opponent: official Stockfish 2.0 source at the pinned commit, with the disclosed node-polling patch.
          Format: one Ruy Lopez game, Prunex White, 1,000,000 nodes per move, one thread each.

          This one-game result is a smoke test, not a strength rating or Elo estimate.
          EOF
          git -C "$WORKTREE" add "$DEST"
          git -C "$WORKTREE" commit -m "Archive single Prunex vs Stockfish 2.0 game ${GITHUB_RUN_NUMBER}"
          git -C "$WORKTREE" push origin "HEAD:refs/heads/strength-ladder-progress"

      - name: Upload the one-game PGN and telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prunex-single-stockfish-2-game-${{ github.run_number }}
          path: single-game-evidence/
          if-no-files-found: warn
          retention-days: 90
