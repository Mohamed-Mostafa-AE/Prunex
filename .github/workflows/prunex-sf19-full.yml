name: Prunex 0.8.0 deep-search benchmark versus official Stockfish 2.0

on:
  push:
    paths:
      - '.github/workflows/prunex-sf19-full.yml'
      - 'tools/prunex_stockfish4_match.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prunex-sf19-full-confirmation
  cancel-in-progress: true

jobs:
  full-match:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out Prunex project
        uses: actions/checkout@v7
      - name: Check out official Stockfish 19 source
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_19
          path: prunex-core
          persist-credentials: false
      - name: Build Prunex 0.8.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("prunex-core/src/misc.cpp")
          source = path.read_text()
          old = 'ss << "Stockfish " << version << std::setfill(\'0\');'
          new = 'ss << "Prunex 0.8.0 (Stockfish " << version << "-derived)" << std::setfill(\'0\');'
          if source.count(old) != 1:
              raise SystemExit("Unexpected Stockfish 19 engine identity string")
          path.write_text(source.replace(old, new, 1))
          PY
          make -C prunex-core/src -j2 build ARCH=x86-64 COMP=gcc
          cp prunex-core/src/stockfish prunex-0.8.0
          printf 'uci\nisready\nquit\n' | ./prunex-0.8.0 | grep -E 'id name|uciok|readyok'
      - name: Check out official Stockfish 2.0 source
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_2.0
          path: stockfish-2.0
          persist-credentials: false
      - name: Build official Stockfish 2.0
        run: make -C stockfish-2.0/src -j2 build ARCH=x86-64 COMP=gcc
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install reproducible match harness
        run: python -m pip install python-chess==1.999
      - name: Run 64 color-balanced games at equal resources
        run: |
          python tools/prunex_stockfish4_match.py \
            --prunex ./prunex-0.8.0 \
            --prunex-name "Prunex 0.8.0 (Stockfish 19-derived)" \
            --stockfish stockfish-2.0/src/stockfish \
            --opponent-name "Stockfish 2.0" \
            --nodes-per-move 1000000 \
            --prunex-hash 256 \
            --opponent-hash 256 \
            --prunex-contempt 0 \
            --opening-count 16 \
            --repeats 2 \
            --output benchmark-results
      - name: Preserve source provenance and GPLv3 licensing
        if: always()
        run: |
          git -C prunex-core rev-parse HEAD > prunex-provenance.txt
          git -C prunex-core describe --tags --always >> prunex-provenance.txt
          echo 'Prunex 0.8.0 is derived from official Stockfish 19 (tag sf_19); the sole source edit changes UCI engine name.' >> prunex-provenance.txt
          cp prunex-core/Copying.txt Prunex-GPLv3.txt
          cp stockfish-2.0/Copying.txt Stockfish-2.0-GPLv3.txt
          tar --exclude=.git --exclude='*.o' --exclude=stockfish --exclude='*.nnue' --exclude='*.gcda' --exclude='*.gcno' -czf Prunex-0.8.0-source.tar.gz -C prunex-core .
      - name: Upload full PGN, summary, engine, source, and licenses
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Prunex-0.8.0-Stockfish-2.0-64-Game-Confirmation
          path: |
            prunex-0.8.0
            Prunex-0.8.0-source.tar.gz
            Prunex-GPLv3.txt
            Stockfish-2.0-GPLv3.txt
            prunex-provenance.txt
            benchmark-results/
          if-no-files-found: warn
