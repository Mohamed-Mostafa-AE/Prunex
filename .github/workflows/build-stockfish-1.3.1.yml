name: Build official legacy Stockfish 1.3.1

on:
  push:
    paths:
      - '.github/workflows/build-stockfish-1.3.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout official Stockfish 1.3.1 source
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_1.3.1
          path: stockfish-source
          persist-credentials: false
      - name: Compile official source with GCC
        run: |
          sed -i 's/^CXX = icpc$/CXX = g++/' stockfish-source/src/Makefile
          python3 - <<'PY'
          from pathlib import Path
          path = Path('stockfish-source/src/evaluate.cpp')
          lines = path.read_text().splitlines()
          for index in range(len(lines) - 2):
              if lines[index].strip() == 'for (int i = 0; i < 100; i++)' and 'SafetyTable[i+1]' in lines[index + 2]:
                  lines[index] = lines[index].replace('i < 100', 'i < 99')
                  break
          else:
              raise SystemExit('Expected Stockfish 1.3.1 SafetyTable loop was not found')
          path.write_text('\n'.join(lines) + '\n')
          PY
          make -C stockfish-source/src clean
          make -C stockfish-source/src -j2 CXXFLAGS="-DNDEBUG -O3 -fno-exceptions -fomit-frame-pointer -fno-rtti -fno-strict-aliasing -std=gnu++03"
          file stockfish-source/src/stockfish
          ./stockfish-source/src/stockfish bench 4 1 8 default depth
      - name: Record provenance
        run: |
          git -C stockfish-source rev-parse HEAD > stockfish-source-commit.txt
          git -C stockfish-source describe --tags --always >> stockfish-source-commit.txt
          echo 'Build patch: upper bound of the second SafetyTable loop changed from i < 100 to i < 99 to avoid upstream out-of-bounds read of SafetyTable[i+1].' >> stockfish-source-commit.txt
          cp stockfish-source/COPYING stockfish-GPL.txt
      - name: Upload binary, source snapshot, and license
        uses: actions/upload-artifact@v6
        with:
          name: Official-Stockfish-1.3.1-GCC-x86_64
          path: |
            stockfish-source/src/stockfish
            stockfish-source-commit.txt
            stockfish-GPL.txt
          if-no-files-found: error
