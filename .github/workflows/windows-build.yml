name: Windows x64 build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Extract Prunex source archive
        shell: pwsh
        run: Expand-Archive -LiteralPath Prunex.zip -DestinationPath extracted
      - name: Configure
        run: cmake -S extracted/Prunex -B build -A x64
      - name: Build GUI and engine
        run: cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Prunex-Windows-x64
          path: |
            build/Release/Prunex.exe
            build/Release/prunex-cli.exe
          if-no-files-found: error
