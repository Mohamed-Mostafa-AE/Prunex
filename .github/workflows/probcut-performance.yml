name: Prunex ProbCut performance comparison

on:
  push:
    branches: ['engine/probcut-ablation-2026-11-13']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/benchmark/compare_internal_bench.py'
      - '.github/workflows/probcut-performance.yml'

permissions:
  contents: read

concurrency:
  group: prunex-probcut-performance
  cancel-in-progress: false

jobs:
  fixed-suite-comparison:
    name: Measure ProbCut search overhead
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BASELINE_SHA: 2f22662e6bcc935af0ed8a0fdf95b9cb4c84b139
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++
      - name: Build exact baseline and candidate
        run: |
          git worktree add --detach ../prunex-probcut-baseline "$BASELINE_SHA"
          cmake -S ../prunex-probcut-baseline -B ../prunex-probcut-baseline/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build ../prunex-probcut-baseline/build --target prunex --parallel 2
          cmake -S . -B build-probcut -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build build-probcut --target prunex --parallel 2
      - name: Run repeated fixed-position and equal-node comparisons
        run: |
          python3 tools/benchmark/compare_internal_bench.py \
            --baseline ../prunex-probcut-baseline/build/prunex \
            --candidate build-probcut/prunex \
            --baseline-commit "$BASELINE_SHA" \
            --candidate-commit "$GITHUB_SHA" \
            --depth 6 --runs 5 --node-budget 200000 \
            --output probcut-performance.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: prunex-probcut-performance-${{ github.run_number }}
          path: probcut-performance.json
          if-no-files-found: error
          retention-days: 90
