name: Native WebAssembly build and parity

on:
  push:
    branches: [main, 'feature/**', 'docs/**']
    paths:
      - 'src/**'
      - 'tests/wasm_parity_reference.cpp'
      - 'tests/wasm-parity.mjs'
      - 'CMakeLists.txt'
      - '.github/workflows/wasm-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/wasm_parity_reference.cpp'
      - 'tests/wasm-parity.mjs'
      - 'CMakeLists.txt'
      - '.github/workflows/wasm-ci.yml'
  workflow_dispatch:

concurrency:
  group: prunex-wasm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++
      - name: Build native parity reference
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/native --target prunex_parity_reference --parallel 2
      - name: Set up pinned Emscripten SDK
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: '6.0.13'
      - name: Verify toolchain
        run: emcc --version
      - name: Configure and compile native WebAssembly module
        run: |
          emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm --target prunex-wasm --parallel 2
      - name: Compare native and WebAssembly results
        run: node tests/wasm-parity.mjs build/wasm/prunex-wasm.js build/native/prunex_parity_reference
      - name: Verify WebAssembly artifacts
        run: |
          test -s build/wasm/prunex-wasm.js
          test -s build/wasm/prunex-wasm.wasm

      - name: Publish browser WebAssembly assets to this branch
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          mkdir -p website/public/engine
          cp build/wasm/prunex-wasm.js website/public/engine/prunex-wasm.js
          cp build/wasm/prunex-wasm.wasm website/public/engine/prunex-wasm.wasm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/engine/prunex-wasm.js website/public/engine/prunex-wasm.wasm
          if git diff --cached --quiet; then
            echo "Browser WebAssembly assets are already current."
          else
            git commit -m "build: publish Prunex 0.8.0 browser WebAssembly"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          fi

      - name: Upload native WebAssembly build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Prunex-0.8.0-WebAssembly
          path: |
            build/wasm/prunex-wasm.js
            build/wasm/prunex-wasm.wasm
          if-no-files-found: error
          retention-days: 30
