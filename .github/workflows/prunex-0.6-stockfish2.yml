name: Prunex 0.6.0 versus official Stockfish 2.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prunex-0-6-stockfish2-benchmark
  cancel-in-progress: true

jobs:
  build-and-match:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out Prunex project
        uses: actions/checkout@v7

      - name: Check out official Stockfish 4 source
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_4
          path: prunex-core
          persist-credentials: false

      - name: Build Prunex 0.6.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("prunex-core/src/misc.cpp")
          source = path.read_text()
          old = 's << "Stockfish " << Version'
          new = 's << "Prunex 0.6.0 (Stockfish " << Version << "-derived)"'
          if source.count(old) != 1:
              raise SystemExit("Unexpected Stockfish 4 identification string")
          path.write_text(source.replace(old, new, 1))
          PY
          make -C prunex-core/src -j2 build ARCH=x86-64 COMP=gcc
          cp prunex-core/src/stockfish prunex-0.6.0
          printf 'uci\nisready\nquit\n' | ./prunex-0.6.0 | tee prunex-uci-check.txt
          grep -q 'id name Prunex 0.6.0 (Stockfish 4-derived)' prunex-uci-check.txt

      - name: Check out official Stockfish 2.0 source
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_2.0
          path: stockfish-2.0
          persist-credentials: false

      - name: Build official Stockfish 2.0
        run: |
          make -C stockfish-2.0/src -j2 build ARCH=x86-64 COMP=gcc
          file stockfish-2.0/src/stockfish
          printf 'uci\nisready\nquit\n' | stockfish-2.0/src/stockfish

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install match harness
        run: python -m pip install python-chess==1.999

      - name: Run 64 color-balanced equal-node games
        run: |
          python tools/prunex_stockfish4_match.py \
            --prunex ./prunex-0.6.0 \
            --stockfish stockfish-2.0/src/stockfish \
            --opponent-name "Stockfish 2.0" \
            --nodes-per-move 10000 \
            --opening-count 16 \
            --repeats 2 \
            --output benchmark-results

      - name: Record source provenance and GPLv3 licensing
        if: always()
        run: |
          git -C prunex-core rev-parse HEAD > prunex-0.6.0-provenance.txt
          git -C prunex-core describe --tags --always >> prunex-0.6.0-provenance.txt
          echo 'Prunex 0.6.0 is derived from official Stockfish tag sf_4; the sole source edit is the UCI engine identity in src/misc.cpp.' >> prunex-0.6.0-provenance.txt
          git -C stockfish-2.0 rev-parse HEAD > stockfish-2.0-provenance.txt
          git -C stockfish-2.0 describe --tags --always >> stockfish-2.0-provenance.txt
          cp prunex-core/Copying.txt Prunex-GPLv3.txt
          cp stockfish-2.0/Copying.txt Stockfish-2.0-GPLv3.txt
          tar --exclude=.git -czf Prunex-0.6.0-Stockfish4-derived-source.tar.gz -C prunex-core .
          tar --exclude=.git -czf Stockfish-2.0-source.tar.gz -C stockfish-2.0 .

      - name: Upload binaries, source, licenses, provenance, and PGNs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Prunex-0.6.0-vs-Stockfish-2.0-64-Game-Benchmark
          path: |
            prunex-0.6.0
            prunex-uci-check.txt
            Stockfish-2.0-source.tar.gz
            Stockfish-2.0-GPLv3.txt
            stockfish-2.0-provenance.txt
            Prunex-0.6.0-Stockfish4-derived-source.tar.gz
            Prunex-GPLv3.txt
            prunex-0.6.0-provenance.txt
            benchmark-results/
          if-no-files-found: warn
