name: Prunex continuation-history ablation match

on:
  push:
    branches: ['engine/continuation-history-2026-11-13']
    paths:
      - 'src/**'
      - 'tools/strength-match/internal_selfplay.py'
      - '.github/workflows/continuation-history-ablation.yml'
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Paired openings (each played with both colours)'
        required: true
        default: '100'
        type: string
      nodes:
        description: 'Equal node limit per move'
        required: true
        default: '100000'
        type: string

permissions:
  contents: read

concurrency:
  group: prunex-continuation-history-ablation
  cancel-in-progress: false

jobs:
  paired-pruning-match:
    name: Compare continuation history against PR #63
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BASELINE_SHA: c19df7176896a32756377309de84af071f8111bd
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install build and match dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++
          python3 -m pip install --user --disable-pip-version-check python-chess==1.999

      - name: Build the PR #63 baseline
        run: |
          git worktree add --detach ../prunex-continuation-baseline "$BASELINE_SHA"
          cmake -S ../prunex-continuation-baseline -B ../prunex-continuation-baseline/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build ../prunex-continuation-baseline/build --target prunex --parallel 2

      - name: Build the continuation-history candidate
        run: |
          cmake -S . -B build-continuation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build build-continuation --target prunex --parallel 2

      - name: Verify the match harness
        run: python3 tests/test_internal_selfplay.py

      - name: Run paired-colour equal-node comparison
        env:
          PAIRS_INPUT: ${{ inputs.pairs }}
          NODES_INPUT: ${{ inputs.nodes }}
        run: |
          python3 tools/strength-match/internal_selfplay.py \
            --baseline ../prunex-continuation-baseline/build/prunex \
            --candidate build-continuation/prunex \
            --baseline-commit "$BASELINE_SHA" \
            --candidate-commit "$GITHUB_SHA" \
            --pairs "${PAIRS_INPUT:-100}" \
            --nodes "${NODES_INPUT:-100000}" \
            --hash-mb 128 --threads 1 --seed 20261113 --max-plies 240 \
            --out continuation-history-ablation-results

      - name: Create and verify evidence checksums
        if: always()
        run: |
          if [ -d continuation-history-ablation-results ]; then
            (cd continuation-history-ablation-results && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > continuation-history-ablation-results/SHA256SUMS.txt
            (cd continuation-history-ablation-results && sha256sum --check SHA256SUMS.txt)
          fi

      - name: Upload PGN, telemetry, summary and manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: prunex-continuation-history-ablation-${{ github.run_number }}
          path: continuation-history-ablation-results/
          if-no-files-found: warn
          retention-days: 90
