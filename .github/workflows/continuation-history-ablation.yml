name: Prunex continuation-history ablation

on:
  push:
    branches: ['engine/continuation-history-v2-2026-11-13']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/strength-match/internal_selfplay.py'
      - '.github/workflows/continuation-history-ablation.yml'
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Paired opening positions'
        required: true
        default: '100'
        type: string
      nodes:
        description: 'Equal node limit per move'
        required: true
        default: '100000'
        type: string

permissions:
  contents: read

concurrency:
  group: prunex-continuation-history-ablation
  cancel-in-progress: false

jobs:
  paired-ablation:
    name: Baseline versus continuation-history candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BASELINE_SHA: c19df7176896a32756377309de84af071f8111bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install compiler and chess test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++
          python3 -m pip install --user --disable-pip-version-check python-chess==1.999

      - name: Build exact baseline
        run: |
          git worktree add --detach ../prunex-baseline "$BASELINE_SHA"
          cmake -S ../prunex-baseline -B ../prunex-baseline/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build ../prunex-baseline/build --target prunex --parallel 2

      - name: Build candidate
        run: |
          cmake -S . -B build-ablation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build build-ablation --target prunex --parallel 2

      - name: Run native regression suite
        run: |
          cmake -S . -B build-ablation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          ctest --test-dir build-ablation --output-on-failure --parallel 2

      - name: Test paired-match harness
        run: python3 tests/test_internal_selfplay.py

      - name: Run paired-colour equal-node match
        env:
          PAIRS_INPUT: ${{ inputs.pairs }}
          NODES_INPUT: ${{ inputs.nodes }}
        run: |
          python3 tools/strength-match/internal_selfplay.py \
            --baseline ../prunex-baseline/build/prunex \
            --candidate build-ablation/prunex \
            --baseline-commit "$BASELINE_SHA" \
            --candidate-commit "$GITHUB_SHA" \
            --pairs "${PAIRS_INPUT:-100}" \
            --nodes "${NODES_INPUT:-100000}" \
            --hash-mb 128 --threads 1 --seed 20261113 --max-plies 240 \
            --out continuation-history-results

      - name: Create and verify evidence checksums
        if: always()
        run: |
          if [ -d continuation-history-results ]; then
            (cd continuation-history-results && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > continuation-history-results/SHA256SUMS.txt
            (cd continuation-history-results && sha256sum --check SHA256SUMS.txt)
          fi

      - name: Upload PGN, telemetry, summaries and checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prunex-continuation-history-ablation-${{ github.run_number }}
          path: continuation-history-results/
          if-no-files-found: warn
          retention-days: 90
