name: Prunex 0.7.0 1M-node qualification versus Stockfish 2.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out Prunex
        uses: actions/checkout@v7
      - name: Check out Stockfish 11 source
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_11
          path: prunex-core
          persist-credentials: false
      - name: Build Prunex 0.7.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("prunex-core/src/misc.cpp")
          s=p.read_text()
          old='ss << "Stockfish " << Version << setfill(\'0\');'
          new='ss << "Prunex 0.7.0 (Stockfish " << Version << "-derived)" << setfill(\'0\');'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          make -C prunex-core/src -j2 build ARCH=x86-64 COMP=gcc
          cp prunex-core/src/stockfish prunex-0.7.0
      - name: Check out official Stockfish 2.0
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_2.0
          path: stockfish-2.0
          persist-credentials: false
      - name: Build Stockfish 2.0
        run: make -C stockfish-2.0/src -j2 build ARCH=x86-64 COMP=gcc
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install chess harness
        run: python -m pip install python-chess==1.999
      - name: Run 16 balanced 1M-node games for both engines
        run: |
          python tools/prunex_stockfish4_match.py \
            --prunex ./prunex-0.7.0 \
            --prunex-name "Prunex 0.7.0 (Stockfish 11-derived)" \
            --stockfish stockfish-2.0/src/stockfish \
            --opponent-name "Stockfish 2.0" \
            --nodes-per-move 1000000 \
            --prunex-hash 128 \
            --opponent-hash 128 \
            --prunex-contempt 0 \
            --opening-count 8 \
            --repeats 1 \
            --output benchmark-results
      - name: Upload qualification results and GPLv3 source
        if: always()
        run: |
          git -C prunex-core rev-parse HEAD > prunex-provenance.txt
          echo 'Prunex 0.7.0 derives from official Stockfish 11, tag sf_11.' >> prunex-provenance.txt
          cp prunex-core/Copying.txt Prunex-GPLv3.txt
          tar --exclude=.git -czf Prunex-0.7.0-source.tar.gz -C prunex-core .
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Prunex-0.7.0-SF11-1M-Qualification
          path: |
            prunex-0.7.0
            prunex-provenance.txt
            Prunex-GPLv3.txt
            Prunex-0.7.0-source.tar.gz
            benchmark-results/
          if-no-files-found: warn
