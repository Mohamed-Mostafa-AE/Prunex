name: Verify archived Stockfish 2.0 benchmark

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'tools/verify_stockfish2_match.py'
      - 'benchmarks/stockfish-2.0/**'
      - '.github/workflows/stockfish2-evidence-audit.yml'
  pull_request:
    paths:
      - 'tools/verify_stockfish2_match.py'
      - 'benchmarks/stockfish-2.0/**'
      - '.github/workflows/stockfish2-evidence-audit.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-archived-match:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the original successful Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41253517143 \
            --repo Mohamed-Mostafa-AE/Prunex \
            --name Prunex-0.8.0-Stockfish-2.0-64-Game-Confirmation \
            --dir evidence-artifact
      - name: Recount all games and compare the archived summary
        run: |
          python tools/verify_stockfish2_match.py \
            --pgn evidence-artifact/benchmark-results/prunex-vs-stockfish-2.0.pgn \
            --summary evidence-artifact/benchmark-results/summary.json
      - name: Verify archived PGN and summary checksums
        run: |
          echo '71727644f4f6582aab6714ae6e998d7d65a31bca7134f8d5d47836c0c89d2c72  evidence-artifact/benchmark-results/prunex-vs-stockfish-2.0.pgn' | sha256sum --check
          echo '8417593569b9d2a031036e2e5952f0e009d79f49c22b2f1edcf8143a83e740fd  evidence-artifact/benchmark-results/summary.json' | sha256sum --check
