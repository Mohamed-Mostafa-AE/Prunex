name: Prunex 0.6.0 — Stockfish-derived build and legacy benchmark

on:
  push:
    paths:
      - '.github/workflows/prunex-0.6-stockfish4.yml'
      - 'tools/prunex_stockfish4_match.py'
      - 'PRUNEX-0.6.0-DERIVATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prunex-0-6-stockfish13-benchmark
  cancel-in-progress: true

jobs:
  build-and-match:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out Prunex project
        uses: actions/checkout@v7

      - name: Check out official Stockfish 4 source
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_4
          path: prunex-core
          persist-credentials: false

      - name: Build the Prunex 0.6.0 branded derivative
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("prunex-core/src/misc.cpp")
          source = path.read_text()
          old = 's << "Stockfish " << Version'
          new = 's << "Prunex 0.6.0 (Stockfish " << Version << "-derived)"'
          if source.count(old) != 1:
              raise SystemExit("Unexpected Stockfish 4 engine identification string")
          path.write_text(source.replace(old, new, 1))
          PY
          make -C prunex-core/src -j2 build ARCH=x86-64 COMP=gcc
          cp prunex-core/src/stockfish prunex-0.6.0
          printf 'uci\nisready\nquit\n' | ./prunex-0.6.0 | tee prunex-uci-check.txt
          grep -q 'id name Prunex 0.6.0 (Stockfish 4-derived)' prunex-uci-check.txt

      - name: Check out official Stockfish 1.3.1 source
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_1.3.1
          path: stockfish-1.3.1
          persist-credentials: false

      - name: Patch the legacy compiler compatibility issue and build Stockfish 1.3.1
        run: |
          sed -i 's/^CXX = icpc$/CXX = g++/' stockfish-1.3.1/src/Makefile
          python3 - <<'PY'
          from pathlib import Path
          path = Path("stockfish-1.3.1/src/evaluate.cpp")
          lines = path.read_text().splitlines()
          for index in range(len(lines) - 2):
              if lines[index].strip() == "for (int i = 0; i < 100; i++)" and "SafetyTable[i+1]" in lines[index + 2]:
                  lines[index] = lines[index].replace("i < 100", "i < 99")
                  break
          else:
              raise SystemExit("Expected Stockfish 1.3.1 SafetyTable loop was not found")
          path.write_text("\n".join(lines) + "\n")
          PY
          make -C stockfish-1.3.1/src clean
          make -C stockfish-1.3.1/src -j2 CXXFLAGS="-DNDEBUG -O3 -fno-exceptions -fomit-frame-pointer -fno-rtti -fno-strict-aliasing -std=gnu++03"
          file stockfish-1.3.1/src/stockfish
          printf 'uci\nisready\nquit\n' | stockfish-1.3.1/src/stockfish

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install match runner
        run: python -m pip install python-chess==1.999

      - name: Run 16 color-balanced equal-node games
        run: |
          python tools/prunex_stockfish4_match.py \
            --prunex ./prunex-0.6.0 \
            --stockfish stockfish-1.3.1/src/stockfish \
            --nodes-per-move 10000 \
            --opening-count 8 \
            --repeats 1 \
            --output benchmark-results

      - name: Record source provenance and GPLv3 licensing
        if: always()
        run: |
          git -C prunex-core rev-parse HEAD > prunex-0.6.0-provenance.txt
          git -C prunex-core describe --tags --always >> prunex-0.6.0-provenance.txt
          echo 'Prunex 0.6.0 is derived from official Stockfish tag sf_4. The sole source edit is the UCI engine identification string in src/misc.cpp.' >> prunex-0.6.0-provenance.txt
          git -C stockfish-1.3.1 rev-parse HEAD > stockfish-1.3.1-provenance.txt
          git -C stockfish-1.3.1 describe --tags --always >> stockfish-1.3.1-provenance.txt
          echo 'Compatibility patch: changed the second SafetyTable loop upper bound from i < 100 to i < 99 to prevent the upstream out-of-bounds read of SafetyTable[i+1].' >> stockfish-1.3.1-provenance.txt
          cp prunex-core/Copying.txt Prunex-GPLv3.txt
          cp stockfish-1.3.1/Copying.txt Stockfish-1.3.1-GPLv3.txt
          tar --exclude=.git -czf Prunex-0.6.0-Stockfish4-derived-source.tar.gz -C prunex-core .
          tar --exclude=.git -czf Stockfish-1.3.1-source-patched.tar.gz -C stockfish-1.3.1 .

      - name: Upload engine, source, licenses, provenance, and match records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Prunex-0.6.0-Stockfish4-Derived-Benchmark-and-GPLv3-Source
          path: |
            prunex-0.6.0
            prunex-uci-check.txt
            Prunex-0.6.0-Stockfish4-derived-source.tar.gz
            Prunex-GPLv3.txt
            prunex-0.6.0-provenance.txt
            Stockfish-1.3.1-source-patched.tar.gz
            Stockfish-1.3.1-GPLv3.txt
            stockfish-1.3.1-provenance.txt
            benchmark-results/
          if-no-files-found: warn
