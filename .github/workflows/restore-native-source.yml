name: Restore native Prunex source tree

on:
  push:
    paths:
      - '.github/workflows/restore-native-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore native source from the historical source archive
        shell: bash
        run: |
          set -euo pipefail
          git show 7f5bf20019b06af6d93b01a5b0db2aa7728c4cb1:Prunex-0.5.1.zip > /tmp/Prunex-0.5.1.zip
          mkdir -p /tmp/prunex-source
          unzip -q /tmp/Prunex-0.5.1.zip -d /tmp/prunex-source
          test -s /tmp/prunex-source/Prunex/src/main.cpp
          test -s /tmp/prunex-source/Prunex/src/gui.cpp
          test -s /tmp/prunex-source/Prunex/CMakeLists.txt
          mkdir -p src tests
          cp -a /tmp/prunex-source/Prunex/src/. src/
          cp -a /tmp/prunex-source/Prunex/tests/. tests/
          cp /tmp/prunex-source/Prunex/CMakeLists.txt ./CMakeLists.txt
          cp /tmp/prunex-source/Prunex/.clang-format ./.clang-format
          rm -f src/README.md
          git add src tests CMakeLists.txt .clang-format
          if git diff --cached --quiet; then
            echo "Native source is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore Prunex C++ source and tests as normal folders"
          git push origin HEAD:main
