name: Validate backup automation

on:
  pull_request:
    paths:
      - 'tools/backup/**'
      - '.github/workflows/prunex-db-backup.yml'
      - '.github/workflows/backup-tools-ci.yml'
  push:
    paths:
      - 'tools/backup/**'
      - '.github/workflows/prunex-db-backup.yml'
      - '.github/workflows/backup-tools-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate shell syntax and style
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          bash -n tools/backup/verify-restore.sh
          shellcheck --severity=style tools/backup/verify-restore.sh
      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file); puts "YAML syntax OK: #{file}" }' \
            .github/workflows/prunex-db-backup.yml \
            .github/workflows/backup-tools-ci.yml
