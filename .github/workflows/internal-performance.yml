name: Prunex internal fixed-position performance comparison

on:
  push:
    branches: ['engine/stockfish-gap-rebuild-2026-11']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/benchmark/**'
      - '.github/workflows/internal-performance.yml'
  workflow_dispatch:
    inputs:
      depth:
        description: 'Fixed search depth (1-10)'
        required: true
        default: '5'
        type: string
      runs:
        description: 'Repeated runs per engine (3-20)'
        required: true
        default: '5'
        type: string
      node_budget:
        description: 'UCI node cap per position (10000-5000000)'
        required: true
        default: '200000'
        type: string

permissions:
  contents: read

concurrency:
  group: prunex-internal-performance
  cancel-in-progress: false

jobs:
  fixed-suite-comparison:
    name: Compare fixed-position search performance
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      BASELINE_SHA: 129829dd95672e83a347563526ae7b28ccf1ea63
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++

      - name: Build the archived baseline and search checkpoints
        env:
          MOVE_BUFFER_SHA: 878aea7000f1e9adb549784bbee2d6641adf6e63
          STAGED_PICKER_SHA: 91a0dd706332fe866fce1fe1ff637ebdab409d02
          HISTORY_SHA: 8a3d936c6e84953c786e28ec9f983b2c8e9783f6
          TACTICAL_QSEARCH_SHA: 240269bd6ed1c4dd8b131122c99b072022c4706f
        run: |
          set -euo pipefail
          build_variant() {
            label="$1"
            sha="$2"
            directory="../prunex-$label"
            git worktree add --detach "$directory" "$sha"
            cmake -S "$directory" -B "$directory/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build "$directory/build" --target prunex --parallel 2
            printf '%s\t%s\t%s\n' "$label" "$sha" "$directory/build/prunex" >> variants.tsv
          }
          : > variants.tsv
          build_variant baseline "$BASELINE_SHA"
          build_variant move-buffer "$MOVE_BUFFER_SHA"
          build_variant staged-picker "$STAGED_PICKER_SHA"
          build_variant histories "$HISTORY_SHA"
          build_variant tactical-qsearch "$TACTICAL_QSEARCH_SHA"
          build_variant current "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          variants = []
          for line in Path("variants.tsv").read_text().splitlines():
              label, commit, binary = line.split("\t")
              variants.append({"label": label, "commit": commit, "binary": binary})
          Path("search-variants.json").write_text(json.dumps(variants, indent=2) + "\n")
          PY

      - name: Run fixed-depth and equal-node search ablation
        run: |
          python3 tools/benchmark/compare_search_ablation.py \
            --variants search-variants.json \
            --depth "${{ inputs.depth || '5' }}" \
            --runs "${{ inputs.runs || '3' }}" \
            --node-budget "${{ inputs.node_budget || '200000' }}" \
            --output search-ablation.json

      - name: Upload internal benchmark evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: prunex-search-ablation-${{ github.run_number }}
          path: search-ablation.json
          if-no-files-found: error
          retention-days: 90
