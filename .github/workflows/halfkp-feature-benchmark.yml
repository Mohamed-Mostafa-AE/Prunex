name: Prunex HalfKP feature extraction benchmark

on:
  push:
    branches: ['engine/fast-halfkp-feature-parser-2026-11-13']
    paths:
      - 'tools/training/train_halfkp.py'
      - 'tools/training/benchmark_halfkp_features.py'
      - '.github/workflows/halfkp-feature-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: |
          python -m pip install --disable-pip-version-check python-chess==1.999
          python -m pip install --disable-pip-version-check -r tools/training/requirements-nnue.txt
      - name: Benchmark feature extraction
        run: |
          python tools/training/benchmark_halfkp_features.py \
            --positions 20000 --runs 5 --seed 20261113 \
            | tee halfkp-feature-performance.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: prunex-halfkp-feature-extraction-performance-${{ github.run_number }}
          path: halfkp-feature-performance.json
          if-no-files-found: error
          retention-days: 90
