name: Validate Prunex website

on:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/prunex-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/prunex-preview.log
          exit 1
      - name: Browser smoke test
        run: npm run test:browser
      - name: Required output assets
        run: |
          test -s dist/index.html
          test -s dist/prunex-logo.jpg
          test -s dist/engine/stockfish-19-lite-single.js
          test -s dist/engine/stockfish-19-lite-single.wasm
          test -s dist/COPYING.txt
