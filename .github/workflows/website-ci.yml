name: Validate Prunex Vercel website

on:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production website
        run: npm run build
      - name: Install Chromium for browser test
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/prunex-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Exercise the browser board and engine
        run: npm run test:browser
      - name: Verify required static assets
        run: |
          test -s dist/index.html
          test -s dist/engine/stockfish-19-lite-single.js
          test -s dist/engine/stockfish-19-lite-single.wasm
          test -s dist/engine-source.tar.gz
          test -s dist/COPYING.txt
          grep -q 'mohamedhussam09@gmail.com' dist/index.html
          grep -q 'github.com/Mohamed-Mostafa-GT' dist/index.html
          tar -tzf dist/engine-source.tar.gz | grep -q 'src/'
          grep -q 'GNU GENERAL PUBLIC LICENSE' dist/COPYING.txt
          test -f vercel.json
