name: Validate Prunex website

on:
  push:
    paths:
      - 'website/**'
      - 'tools/training/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Bootstrap a lockfile for this migration run; commit the uploaded lockfile before release.
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile once during repository bootstrap
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): lock website dependency graph"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependency graph
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/prunex-preview.log 2>&1 &
          echo $! > /tmp/prunex-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Vite preview ready (PID $(cat /tmp/prunex-preview.pid))"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prunex-preview.log
          exit 1
      - run: mkdir -p artifacts
      - name: Browser smoke test
        run: npm run test:browser
      - name: Required output assets
        run: |
          test -s dist/index.html
          test -s dist/prunex-mark.png
          test -s dist/engine/stockfish-19.js
          test -s dist/engine/stockfish-19.wasm
          test -s dist/COPYING.txt

      - name: Upload npm lockfile for review and commit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prunex-npm-lockfile
          path: website/package-lock.json
          if-no-files-found: warn
          retention-days: 3

      - name: Stop Vite preview
        if: always()
        run: |
          if [ -f /tmp/prunex-preview.pid ]; then
            kill "$(cat /tmp/prunex-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prunex-responsive-device-review
          path: website/artifacts/*.png
          if-no-files-found: warn
          retention-days: 3

  test-training-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/training/requirements.txt
      - name: Install pinned corpus-import dependencies
        run: python -m pip install -r tools/training/requirements.txt
      - name: Test PGN parsing, filtering, splitting and manifests
        run: python -m unittest discover -s tools/training/tests -v
      - name: Audit Python training dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r tools/training/requirements.txt
