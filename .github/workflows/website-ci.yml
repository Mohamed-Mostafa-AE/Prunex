name: Validate Prunex website

on:
  push:
    paths:
      - 'website/**'
      - 'tools/training/**'
      - 'supabase/**'
      - 'scripts/test-auth-email-templates.mjs'
      - '.github/workflows/website-ci.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'tools/training/**'
      - 'supabase/**'
      - 'scripts/test-auth-email-templates.mjs'
      - '.github/workflows/website-ci.yml'
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Supabase Auth email templates
        working-directory: .
        run: node scripts/test-auth-email-templates.mjs
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependency graph
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Verify preinstalled browser
        id: browser
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser_path" ]; then
            echo "No system Chrome/Chromium executable is available on this runner."
            exit 1
          fi
          "$browser_path" --version
          echo "executable=$browser_path" >> "$GITHUB_OUTPUT"
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/prunex-preview.log 2>&1 &
          echo $! > /tmp/prunex-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Vite preview ready (PID $(cat /tmp/prunex-preview.pid))"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prunex-preview.log
          exit 1
      - run: mkdir -p artifacts
      - name: Browser smoke test
        env:
          PRUNEX_CHROMIUM_EXECUTABLE_PATH: ${{ steps.browser.outputs.executable }}
        run: npm run test:browser
      - name: Required output assets
        run: |
          test -s dist/index.html
          test -s dist/prunex-mark.png
          test -s dist/engine/stockfish-19.js
          test -s dist/engine/stockfish-19.wasm
          test -s dist/COPYING.txt

      - name: Stop Vite preview
        if: always()
        run: |
          if [ -f /tmp/prunex-preview.pid ]; then
            kill "$(cat /tmp/prunex-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prunex-responsive-device-review
          path: website/artifacts/*.png
          if-no-files-found: warn
          retention-days: 3

  test-training-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/training/requirements.txt
      - name: Install pinned corpus-import dependencies
        run: python -m pip install -r tools/training/requirements.txt
      - name: Test PGN parsing, filtering, splitting and manifests
        run: python -m unittest discover -s tools/training/tests -v
      - name: Audit Python training dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r tools/training/requirements.txt
