name: Prunex ProbCut paired match

on:
  push:
    branches: ['engine/probcut-ablation-2026-11-13']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/strength-match/internal_selfplay.py'
      - '.github/workflows/probcut-ablation.yml'

permissions:
  contents: read

concurrency:
  group: prunex-probcut-ablation
  cancel-in-progress: false

jobs:
  paired-match:
    name: Test ProbCut against exact baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BASELINE_SHA: 2f22662e6bcc935af0ed8a0fdf95b9cb4c84b139
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install build and match dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++
          python3 -m pip install --user --disable-pip-version-check python-chess==1.999
      - name: Build baseline and candidate
        run: |
          git worktree add --detach ../prunex-probcut-baseline "$BASELINE_SHA"
          cmake -S ../prunex-probcut-baseline -B ../prunex-probcut-baseline/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build ../prunex-probcut-baseline/build --target prunex --parallel 2
          cmake -S . -B build-probcut -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPRUNEX_TT_BITS=22
          cmake --build build-probcut --parallel 2
          ctest --test-dir build-probcut --output-on-failure --parallel 2
          python3 tests/test_internal_selfplay.py
      - name: Run paired-colour equal-node match
        run: |
          python3 tools/strength-match/internal_selfplay.py \
            --baseline ../prunex-probcut-baseline/build/prunex \
            --candidate build-probcut/prunex \
            --baseline-commit "$BASELINE_SHA" \
            --candidate-commit "$GITHUB_SHA" \
            --pairs 100 --nodes 100000 \
            --hash-mb 128 --threads 1 --seed 20261116 --max-plies 240 \
            --out probcut-results
      - name: Create and verify evidence checksums
        if: always()
        run: |
          if [ -d probcut-results ]; then
            (cd probcut-results && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > probcut-results/SHA256SUMS.txt
            (cd probcut-results && sha256sum --check SHA256SUMS.txt)
          fi
      - name: Upload match evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: prunex-probcut-match-${{ github.run_number }}
          path: probcut-results/
          if-no-files-found: warn
          retention-days: 90
