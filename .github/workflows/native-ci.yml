name: Native compiler matrix and sanitizers

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-ci.yml'
  workflow_dispatch:

concurrency:
  group: prunex-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compiler-matrix:
    name: ${{ matrix.compiler }} regression suite
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            sudo apt-get install --yes clang
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run complete native regression suite
        run: ctest --test-dir build --output-on-failure --parallel 2

  strength-telemetry-tests:
    name: UCI final search telemetry tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Python data-tool dependencies
        run: python3 -m pip install --user --disable-pip-version-check python-chess zstandard
      - name: Verify final UCI search counters are parsed exactly
        run: python3 tests/test_modern_strength_ladder_telemetry.py
      - name: Verify internal paired self-play harness
        run: python3 tests/test_internal_selfplay.py
      - name: Verify licensed Lichess evaluation importer
        run: python3 tools/training/tests/test_lichess_eval.py

  sanitizers:
    name: GCC AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++
      - name: Configure sanitizer build
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Run sanitized regression suite
        run: ctest --test-dir build-sanitize --output-on-failure --parallel 2
