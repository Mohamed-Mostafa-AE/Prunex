name: Verified Prunex vs Stockfish 2.0 — 64 games

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stockfish-2.0-64.yml'
      - 'tools/stockfish-2.0-match/**'
      - 'tests/test_stockfish_2_verifier.py'
      - 'tests/test_replay_evidence.py'
      - 'docs/stockfish-2.0-reproduction.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stockfish-2.0-64.yml'
      - 'tools/stockfish-2.0-match/**'
      - 'tests/test_stockfish_2_verifier.py'
      - 'tests/test_replay_evidence.py'
      - 'docs/stockfish-2.0-reproduction.md'
  workflow_dispatch:
    inputs:
      nodes_per_move:
        description: 'Maximum nodes per move for each engine'
        required: true
        default: '1000000'
        type: string
      stockfish_hash_mb:
        description: 'Stockfish 2.0 Hash setting in MiB; Prunex uses its fixed native table'
        required: true
        default: '256'
        type: string

permissions:
  contents: read

concurrency:
  group: prunex-stockfish-2-64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  match:
    name: Verify engines, run 64 games, and render replay evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out Prunex source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install build and replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake git ffmpeg
          python3 -m pip install --user python-chess pillow cairosvg

      - name: Build Prunex and run its complete regression suite
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Test opponent verifier and replay renderer
        run: |
          python3 tests/test_stockfish_2_verifier.py
          python3 tests/test_replay_evidence.py

      - name: Build pinned official Stockfish 2.0 source
        run: |
          git clone --depth 1 --branch sf_2.0 https://github.com/official-stockfish/Stockfish.git stockfish-2.0
          SOURCE_COMMIT="$(git -C stockfish-2.0 rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "aa2de53a83ca5423c8c8007abf71f9afdf589d93"
          make -C stockfish-2.0/src build ARCH=x86-64 -j2
          echo "STOCKFISH_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Verify source, UCI identity, and historical benchmark signature
        run: |
          mkdir -p verified-stockfish-2.0-64/evidence
          python3 tools/stockfish-2.0-match/verify_stockfish_2.py \
            --engine stockfish-2.0/src/stockfish \
            --source-commit "$STOCKFISH_SOURCE_COMMIT" \
            --output verified-stockfish-2.0-64/stockfish-verification.json \
            --evidence-dir verified-stockfish-2.0-64/evidence

      - name: Run the 64 color-balanced games
        if: github.event_name != 'pull_request'
        env:
          NODES_PER_MOVE_INPUT: ${{ inputs.nodes_per_move }}
          STOCKFISH_HASH_MB_INPUT: ${{ inputs.stockfish_hash_mb }}
        run: |
          NODES_PER_MOVE="${NODES_PER_MOVE_INPUT:-1000000}"
          STOCKFISH_HASH_MB="${STOCKFISH_HASH_MB_INPUT:-256}"
          python3 tools/stockfish-2.0-match/run_match.py \
            --prunex build/prunex \
            --stockfish stockfish-2.0/src/stockfish \
            --nodes "$NODES_PER_MOVE" \
            --stockfish-hash-mb "$STOCKFISH_HASH_MB" \
            --out verified-stockfish-2.0-64

      - name: Render PGN replay, sound-enabled MP4, and 64-position poster
        if: github.event_name != 'pull_request'
        run: |
          python3 tools/stockfish-2.0-match/render_evidence.py \
            --pgn verified-stockfish-2.0-64/all-games.pgn \
            --out verified-stockfish-2.0-64/evidence \
            --fps 3
          find verified-stockfish-2.0-64 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > verified-stockfish-2.0-64/SHA256SUMS.txt

      - name: Upload complete or partial match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prunex-stockfish-2.0-64-${{ github.run_number }}
          path: verified-stockfish-2.0-64/
          if-no-files-found: warn
          retention-days: 90
