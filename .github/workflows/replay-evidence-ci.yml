name: Prunex strength-ladder replay validation

on:
  push:
    branches: ['feature/modern-ladder-replay-evidence']
    paths:
      - 'tools/strength-match/replay/**'
      - 'tests/test_strength_ladder_replay.py'
      - '.github/workflows/replay-evidence-ci.yml'
  pull_request:
    paths:
      - 'tools/strength-match/replay/**'
      - 'tests/test_strength_ladder_replay.py'
      - '.github/workflows/replay-evidence-ci.yml'

permissions:
  contents: read

jobs:
  replay-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install replay dependencies
        run: |
          python -m pip install --disable-pip-version-check python-chess Pillow cairosvg
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Test PGN validation, sound-enabled viewer, MP4, and archive index
        run: python tests/test_strength_ladder_replay.py
