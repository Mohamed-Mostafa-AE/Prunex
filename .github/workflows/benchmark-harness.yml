name: Check local benchmark harness

on:
  push:
    paths:
      - 'tools/prunex_deep_match.py'
      - 'tools/test_prunex_deep_match.py'
      - 'tools/run_deep_benchmark.sh'
      - '.github/workflows/benchmark-harness.yml'
  pull_request:
    paths:
      - 'tools/prunex_deep_match.py'
      - 'tools/test_prunex_deep_match.py'
      - 'tools/run_deep_benchmark.sh'
      - '.github/workflows/benchmark-harness.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install match harness
        run: python -m pip install python-chess==1.999
      - name: Check Python syntax
        run: python -m py_compile tools/prunex_deep_match.py tools/test_prunex_deep_match.py
      - name: Check launcher syntax
        run: bash -n tools/run_deep_benchmark.sh
      - name: Test schedule, openings, and resume handling
        run: python tools/test_prunex_deep_match.py
