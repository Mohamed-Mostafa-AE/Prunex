[functions.delete-account]
verify_jwt = true

[auth.email.template.email_change]
subject = "Confirm your Prunex account email"
content_path = "./supabase/templates/prunex-email-change.html"

[auth.email.template.recovery]
subject = "Reset your Prunex password"
content_path = "./supabase/templates/prunex-password-recovery.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Prunex password was changed"
content_path = "./supabase/templates/prunex-password-changed.html"
